name: Verify Xi Entropy Field

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run core tests (mass, energy, gradient flow)
        run: |
          pytest tests/ -v --tb=short

      - name: Phase diagram quick sanity check
        run: |
          python scripts/run_phase_diagram.py --quick

      - name: Check free energy monotonicity (full verification)
        run: |
          python tests/test_free_energy.py
