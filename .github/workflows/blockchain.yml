name: Verify Blockchain Foundation

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - 'src/blockchain/**'
      - 'scripts/artifact_receipt.py'
      - 'tests/test_blockchain_commitments.py'
      - '.github/workflows/blockchain.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - 'src/blockchain/**'
      - 'scripts/artifact_receipt.py'
      - 'tests/test_blockchain_commitments.py'
      - '.github/workflows/blockchain.yml'

permissions:
  contents: read

jobs:
  blockchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run artifact receipt tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_blockchain_commitments.py -v
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: false
      - name: Compile and test anchor contract
        run: |
          forge build
          forge test -vvv
